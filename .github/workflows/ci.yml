name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint frontend
        run: pnpm --filter @rdp/web lint

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python linting tools
        run: pip install ruff

      - name: Lint backend
        run: ruff check apps/api

  test-backend:
    name: Test Backend
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: rdp_user
          POSTGRES_PASSWORD: rdp_password
          POSTGRES_DB: research_data_platform
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rdp_user -d research_data_platform"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql+asyncpg://rdp_user:rdp_password@localhost:5432/research_data_platform
      DATABASE_URL_SYNC: postgresql://rdp_user:rdp_password@localhost:5432/research_data_platform
      SECRET_KEY: ci-test-secret-key
      PYTHONPATH: ${{ github.workspace }}/apps/api
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/api/requirements.txt

      - name: Install dependencies
        run: pip install -r apps/api/requirements.txt

      - name: Validate migrations
        working-directory: apps/api
        run: alembic upgrade head

      - name: Run tests
        working-directory: apps/api
        run: pytest -v --tb=short

  test-frontend:
    name: Test Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm --filter @rdp/web exec tsc -b --noEmit

      - name: Build packages
        run: pnpm --filter @rdp/shared-types --filter @rdp/api-client build

      - name: Run frontend tests
        run: pnpm --filter @rdp/web test

      - name: Build web
        run: pnpm --filter @rdp/web build

  build:
    name: Build Docker Images
    runs-on: ubuntu-latest
    needs: [lint, test-backend, test-frontend]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push API image
        uses: docker/build-push-action@v6
        with:
          context: ./apps/api
          file: ./apps/api/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/rdp-api:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/rdp-api:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push Web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./apps/web/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/rdp-web:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/rdp-web:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to Render
    runs-on: ubuntu-latest
    needs: [build]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Trigger Render deploys
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
        run: |
          for svc in rdp-api rdp-celery rdp-web; do
            echo "Looking up service: $svc"
            svc_id=$(curl -sf "https://api.render.com/v1/services?name=${svc}&limit=1" \
              -H "Authorization: Bearer $RENDER_API_KEY" \
              | jq -r '.[0].service.id // empty')
            if [ -z "$svc_id" ]; then
              echo "WARNING: could not find service '$svc' — skipping"
              continue
            fi
            echo "Deploying $svc ($svc_id)..."
            deploy_id=$(curl -sf -X POST "https://api.render.com/v1/services/${svc_id}/deploys" \
              -H "Authorization: Bearer $RENDER_API_KEY" \
              -H "Content-Type: application/json" \
              -d '{"clearCache":false}' \
              | jq -r '.id // empty')
            echo "$svc deploy triggered — deploy ID: $deploy_id"
          done
