name: Set Render Env Vars

on:
  workflow_dispatch:

jobs:
  set-env:
    name: Set REQUIRE_SUBSCRIPTION=false on Render
    runs-on: ubuntu-latest
    steps:
      - name: Patch REQUIRE_SUBSCRIPTION env var and redeploy
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
        run: |
          set -e

          # Find rdp-api service
          svc_id=$(curl -sf "https://api.render.com/v1/services?name=rdp-api&limit=1" \
            -H "Authorization: Bearer $RENDER_API_KEY" \
            | jq -r '.[0].service.id // empty')
          echo "Service ID: $svc_id"
          [ -n "$svc_id" ] || { echo "ERROR: service not found"; exit 1; }

          # GET existing env vars and merge in the new value
          existing=$(curl -sf "https://api.render.com/v1/services/${svc_id}/env-vars" \
            -H "Authorization: Bearer $RENDER_API_KEY")
          echo "Existing env vars count: $(echo "$existing" | jq 'length')"

          # Build updated list: keep all existing, override/add REQUIRE_SUBSCRIPTION
          updated=$(echo "$existing" | jq '
            map(select(.key != "REQUIRE_SUBSCRIPTION"))
            + [{"key": "REQUIRE_SUBSCRIPTION", "value": "false"}]
          ')

          # PUT back the full list
          curl -sf -X PUT "https://api.render.com/v1/services/${svc_id}/env-vars" \
            -H "Authorization: Bearer $RENDER_API_KEY" \
            -H "Content-Type: application/json" \
            -d "$updated"
          echo "Env vars updated"

          # Trigger a new deploy
          deploy_id=$(curl -sf -X POST "https://api.render.com/v1/services/${svc_id}/deploys" \
            -H "Authorization: Bearer $RENDER_API_KEY" \
            -H "Content-Type: application/json" \
            -d '{"clearCache":false}' \
            | jq -r '.id // empty')
          echo "Deploy triggered: $deploy_id"
