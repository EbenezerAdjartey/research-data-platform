services:
  # FastAPI Backend (pulls pre-built image from Docker Hub — avoids OOM on Render's free build infra)
  - type: web
    name: rdp-api
    runtime: image
    image:
      url: docker.io/ebenezer401/rdp-api:latest
    plan: free
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: rdp-postgres
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "false"
      - key: CORS_ORIGINS
        value: '["https://rdp-web-b074.onrender.com"]'
      - key: FRONTEND_URL
        value: https://rdp-web-b074.onrender.com
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: STRIPE_PRICE_ID
        sync: false
      - key: REQUIRE_SUBSCRIPTION
        value: "false"
    healthCheckPath: /api/v1/health

  # React Frontend (static site)
  - type: web
    name: rdp-web
    runtime: static
    buildCommand: corepack enable && corepack prepare pnpm@9 --activate && pnpm install --frozen-lockfile && pnpm --filter @rdp/shared-types --filter @rdp/api-client build && pnpm --filter @rdp/web build
    staticPublishPath: ./apps/web/dist
    envVars:
      - key: VITE_API_URL
        value: https://rdp-api-6jxe.onrender.com/api/v1
      - key: VITE_REQUIRE_SUBSCRIPTION
        value: "false"
    routes:
      - type: rewrite
        source: /api/*
        destination: https://rdp-api-6jxe.onrender.com/api/*
      - type: rewrite
        source: /*
        destination: /index.html

databases:
  - name: rdp-postgres
    plan: free
    databaseName: research_data_platform
    user: rdp_user
